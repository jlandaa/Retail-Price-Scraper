name: ETL Frávega (Bi-Weekly)

on:
  schedule:
    # Se ejecuta a las 9:00 AM UTC (6:00 AM Arg) los LUNES (1) y JUEVES (4)
    - cron: '0 9 * * 1,4'
  workflow_dispatch: 

jobs:
  ejecutar-scraper:
    runs-on: ubuntu-latest 

    steps:
    - name: Descargar el repositorio
      uses: actions/checkout@v4 

    - name: Instalar Python
      uses: actions/setup-python@v5 
      with:
        python-version: '3.13.7'

    - name: Instalar librerías
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Correr el Scraper
      env:
        # Acá inyectamos la clave secreta de forma segura
        SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
      run: python scraper/Fravega_Completo.py

    - name: Guardar los datos en el repositorio
      run: |
        git config --global user.name 'GitHub Actions Bot'
        git config --global user.email 'actions@github.com'
        git add .
        git commit -m "🤖 Actualización bi-semanal de precios y limpieza" || echo "No hay cambios para subir"
        git push

   # ⬇️ NUEVO BLOQUE: SUBIR CSV DIRECTAMENTE VÍA API
    - name: 📤 Subir CSV al Volumen de Databricks
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      run: |
        # 1. Encontrar el archivo CSV más reciente en la carpeta data
        FILE_PATH=$(ls data/fravega_*.csv | sort -V | tail -n 1)
        FILE_NAME=$(basename $FILE_PATH)
        
        echo "Subiendo $FILE_NAME al Volumen de Databricks..."
        
        # 2. Hacer un PUT a la API de Databricks (Files API para Unity Catalog Volumes)
        curl -X PUT \
          "${DATABRICKS_HOST}/api/2.0/fs/files/Volumes/workspace/datos_retail/raw_scraping_data/${FILE_NAME}" \
          -H "Authorization: Bearer ${DATABRICKS_TOKEN}" \
          -H "Content-Type: application/octet-stream" \
          --data-binary "@${FILE_PATH}" \
          --fail --silent --show-error
          
        echo "✅ Archivo subido exitosamente."

    - name: Disparar Pipeline en Databricks
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        JOB_ID: "239273899963057"
      run: |
        curl -X POST "${DATABRICKS_HOST}/api/2.1/jobs/run-now" \
        -H "Authorization: Bearer ${DATABRICKS_TOKEN}" \
        -H "Content-Type: application/json" \
        -d "{\"job_id\": ${JOB_ID}}"
